[package]
name = "vx"
version = "0.1.0"
edition = "2021"
description = "Mwan: gestor vx + ejecutor vxr — envoltorio imperativo Nix para distros musl"
license = "MIT"

# Cero dependencias externas a proposito:
# - compila en N150 3.5GB sin descargar crates
# - `cargo build --release --target x86_64-unknown-linux-musl` da binario estatico
# - multicall: mismo binario responde como `vx` o `vxr` segun argv[0]
[[bin]]
name = "vx"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
